name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    name: Validate and create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag and release secrets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/kimi-shell/package.json').version")"
          notes_path="apps/kimi-shell/docs/release-notes-$version.md"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match package version v$version." >&2
            exit 1
          }
          test "$GITHUB_REF_NAME" = "v0.2.3" || {
            echo "The unsigned macOS release exception is restricted to v0.2.3. Restore the signed release workflow before publishing another version." >&2
            exit 1
          }
          test -f "$notes_path" || {
            echo "Release notes are missing: $notes_path" >&2
            exit 1
          }
          test "$(head -n 1 "$notes_path")" = '⚠️ **macOS 版本未签名、未公证**' || {
            echo "Release notes must start with the unsigned macOS warning." >&2
            exit 1
          }
          for name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            test -n "${!name:-}" || {
              echo "Required release secret $name is not configured." >&2
              exit 1
            }
          done
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft >/tmp/release-draft; then
            test "$(cat /tmp/release-draft)" = "true" || {
              echo "Release $GITHUB_REF_NAME already exists and is not a draft." >&2
              exit 1
            }
            gh release edit "$GITHUB_REF_NAME" \
              --notes-file "$notes_path" \
              --title "KickSide $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --notes-file "$notes_path" \
              --title "KickSide $GITHUB_REF_NAME"
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x86_64
            os: windows-latest
            args: --bundles nsis,msi
            release_channel: ad_hoc
          - label: macOS Apple Silicon
            os: macos-15
            args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.macos.unsigned.conf.json
            release_channel: ad_hoc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/kimi-shell/pnpm-lock.yaml

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/kimi-im-bridge/go.mod

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        working-directory: apps/kimi-shell
        run: pnpm install --frozen-lockfile

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          KIMI_RELEASE_CHANNEL: ${{ matrix.release_channel }}
        with:
          projectPath: apps/kimi-shell
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Verify macOS arm64 release bundles
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          bundle_root="apps/kimi-shell/src-tauri/target/aarch64-apple-darwin/release/bundle"
          app_path="$bundle_root/macos/KickSide.app"
          test -d "$app_path"
          plutil -lint "$app_path/Contents/Info.plist"
          lipo "$app_path/Contents/MacOS/appskimi-shell" -verify_arch arm64
          lipo "$app_path/Contents/MacOS/kimi-im-bridge" -verify_arch arm64
          codesign --verify --deep --strict "$app_path"
          signature_details="$(codesign -dvv "$app_path" 2>&1)"
          grep -q 'Signature=adhoc' <<<"$signature_details" || {
            echo "Expected an ad-hoc macOS signature for this unsigned release." >&2
            exit 1
          }
          if grep -q '^Authority=' <<<"$signature_details"; then
            echo "Unexpected Apple signing authority on the unsigned macOS release." >&2
            exit 1
          fi
          test "$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')" = "1"
          test "$(find "$bundle_root/macos" -maxdepth 1 -type f -name '*.app.tar.gz' | wc -l | tr -d ' ')" = "1"
          test "$(find "$bundle_root/macos" -maxdepth 1 -type f -name '*.app.tar.gz.sig' | wc -l | tr -d ' ')" = "1"

      - name: Verify Windows release bundles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleRoot = "apps/kimi-shell/src-tauri/target/release/bundle"
          $nsis = @(Get-ChildItem "$bundleRoot/nsis" -File -Filter "*-setup.exe")
          $msi = @(Get-ChildItem "$bundleRoot/msi" -File -Filter "*.msi")
          if ($nsis.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($nsis.Count)."
          }
          if ($msi.Count -ne 1) {
            throw "Expected exactly one MSI installer, found $($msi.Count)."
          }
          if (-not (Test-Path "$($nsis[0].FullName).sig" -PathType Leaf)) {
            throw "Missing NSIS updater signature for $($nsis[0].Name)."
          }

  publish:
    name: Publish cross-platform updater manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets and build latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets

          exactly_one() {
            local pattern="$1"
            mapfile -t matches < <(find release-assets -maxdepth 1 -type f -name "$pattern" -print)
            test "${#matches[@]}" -eq 1 || {
              echo "Expected one release asset matching $pattern, found ${#matches[@]}." >&2
              exit 1
            }
            printf '%s' "${matches[0]}"
          }

          windows_bundle="$(exactly_one '*-setup.exe')"
          windows_msi="$(exactly_one '*.msi')"
          macos_bundle="$(exactly_one '*.app.tar.gz')"
          macos_dmg="$(exactly_one '*.dmg')"
          test -f "$windows_bundle.sig"
          test -f "$windows_msi.sig"
          test -f "$macos_bundle.sig"
          echo "Verified installers: $(basename "$windows_bundle"), $(basename "$windows_msi"), $(basename "$macos_bundle"), $(basename "$macos_dmg")"

          version="$(node -p "require('./apps/kimi-shell/package.json').version")"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          node apps/kimi-shell/scripts/generate_updater_manifest.mjs \
            --version "$version" \
            --tag "$GITHUB_REF_NAME" \
            --pub-date "$(git show -s --format=%cI "$GITHUB_REF_NAME")" \
            --notes "KickSide $version：新增可信局域网访问与 GitHub/Gitee 双更新源，并改进 DSH 升级和 macOS 附件体验。macOS 安装包未签名、未公证。" \
            --windows-url "$base_url/$(basename "$windows_bundle")" \
            --windows-signature-file "$windows_bundle.sig" \
            --macos-url "$base_url/$(basename "$macos_bundle")" \
            --macos-signature-file "$macos_bundle.sig" \
            --output latest.json
          gitee_base_url="https://gitee.com/endearqb/kickside/releases/download/${GITHUB_REF_NAME}"
          node apps/kimi-shell/scripts/generate_updater_manifest.mjs \
            --version "$version" \
            --tag "$GITHUB_REF_NAME" \
            --pub-date "$(git show -s --format=%cI "$GITHUB_REF_NAME")" \
            --notes "KickSide $version：新增可信局域网访问与 GitHub/Gitee 双更新源，并改进 DSH 升级和 macOS 附件体验。macOS 安装包未签名、未公证。" \
            --windows-url "$gitee_base_url/$(basename "$windows_bundle")" \
            --windows-signature-file "$windows_bundle.sig" \
            --macos-url "$gitee_base_url/$(basename "$macos_bundle")" \
            --macos-signature-file "$macos_bundle.sig" \
            --output gitee-latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Preserve Gitee updater manifest
        uses: actions/upload-artifact@v4
        with:
          name: gitee-updater-manifest
          path: gitee-latest.json
          if-no-files-found: error

  mirror-gitee:
    name: Mirror canonical release to Gitee
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download canonical GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease,body --jq '
            if .isDraft or .isPrerelease then error("canonical release is not stable") else .body end
          ' > release-body.md
          gh release download "$GITHUB_REF_NAME" --dir release-assets

      - name: Download Gitee updater manifest
        uses: actions/download-artifact@v4
        with:
          name: gitee-updater-manifest
          path: gitee-manifest

      - name: Validate canonical asset matrix and publish Gitee mirror
        shell: bash
        env:
          GITEE_RELEASE_TOKEN: ${{ secrets.GITEE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GITEE_RELEASE_TOKEN:-}" || {
            echo "Required release secret GITEE_RELEASE_TOKEN is not configured." >&2
            exit 1
          }

          exactly_one() {
            local pattern="$1"
            mapfile -t matches < <(find release-assets -maxdepth 1 -type f -name "$pattern" -print)
            test "${#matches[@]}" -eq 1 || {
              echo "Expected one canonical asset matching $pattern, found ${#matches[@]}." >&2
              exit 1
            }
            printf '%s' "${matches[0]}"
          }

          windows_bundle="$(exactly_one '*-setup.exe')"
          windows_msi="$(exactly_one '*.msi')"
          macos_bundle="$(exactly_one '*.app.tar.gz')"
          macos_dmg="$(exactly_one '*.dmg')"
          for signature in "$windows_bundle.sig" "$windows_msi.sig" "$macos_bundle.sig"; do
            test -s "$signature"
          done
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = "8"
          test -s gitee-manifest/gitee-latest.json

          node apps/kimi-shell/scripts/publish_gitee_release.mjs \
            --owner endearqb \
            --repo kickside \
            --tag "$GITHUB_REF_NAME" \
            --name "KickSide $GITHUB_REF_NAME" \
            --target "$(git rev-list -n 1 "$GITHUB_REF_NAME")" \
            --body-file release-body.md \
            --asset "$windows_bundle" \
            --asset "$windows_bundle.sig" \
            --asset "$windows_msi" \
            --asset "$windows_msi.sig" \
            --asset "$macos_bundle" \
            --asset "$macos_bundle.sig" \
            --asset "$macos_dmg" \
            --manifest gitee-manifest/gitee-latest.json
