<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --blue: #1783ff;
        --logo: #1783ff;
        --background: #f7f8fa;
        --p-content-max: 760px;
        --space-5: 20px;
        --z-sticky: 100;
        color: #202124;
        font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: #f7f8fa;
        margin: 0;
        overflow: hidden;
      }
      body[data-kimi-sidekick-theme="dark"] {
        background: #18191b;
        color: #f2f3f5;
      }
      .app {
        display: flex;
        height: 100vh;
      }
      .side {
        background: #eef1f5;
        border-right: 1px solid #dfe3e8;
        flex: 0 0 270px;
        overflow: auto;
        padding: 14px 10px;
      }
      body[data-kimi-sidekick-theme="dark"] .side {
        background: #222428;
        border-color: #303338;
      }
      .side button,
      .session-row {
        background: transparent;
        border: 0;
        border-radius: 8px;
        color: inherit;
        display: block;
        padding: 10px;
        text-align: left;
        width: 100%;
      }
      .session-row.active {
        background: rgb(23 131 255 / 12%);
        color: var(--blue);
      }
      .con {
        --read-max: 760px;
        container-type: inline-size;
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        min-width: 0;
        position: relative;
      }
      .chat-header {
        align-items: center;
        background: inherit;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        flex: 0 0 48px;
        font-weight: 600;
        padding: 0 14px;
      }
      body[data-kimi-sidekick-theme="dark"] .chat-header {
        border-color: #303338;
      }
      .chat-layout {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        min-height: 0;
        padding: 28px clamp(16px, 6vw, 72px) 0;
        position: relative;
      }
      .message {
        background: rgb(23 131 255 / 10%);
        border-radius: 14px;
        line-height: 1.6;
        margin-left: auto;
        max-width: 520px;
        padding: 12px 16px;
      }
      .turn-anchor {
        margin-bottom: 12px;
      }
      .conversation-toc {
        --toc-content-max: min(
          var(--p-content-max),
          calc(100cqi - var(--space-5) - var(--space-5))
        );
        display: flex;
        flex-direction: column;
        justify-content: center;
        left: calc(50% + (var(--toc-content-max) / 2) + 14px);
        max-height: calc(100% - 160px);
        opacity: 0.65;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: var(--z-sticky);
      }
      .toc-scroll {
        display: flex;
        flex-direction: column;
        gap: 7px;
        min-height: 0;
        overflow-y: auto;
        padding: 8px 0;
      }
      .toc-row {
        align-items: center;
        background: transparent;
        border: 0;
        color: #6f6f6a;
        display: flex;
        font: inherit;
        gap: 10px;
        height: 18px;
        padding: 0;
        white-space: nowrap;
      }
      .toc-bar {
        background: var(--blue);
        border-radius: 9999px;
        flex: none;
        height: 14px;
        opacity: 0.35;
        width: 3px;
      }
      .toc-label {
        display: block;
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .toc-row.active .toc-bar {
        height: 18px;
        opacity: 1;
      }
      .composer {
        margin-top: auto;
        padding-bottom: 14px;
      }
      .composer-card {
        background: #fff;
        border: 1px solid #dfe3e8;
        border-radius: 14px;
        box-shadow: 0 8px 24px rgb(0 0 0 / 7%);
        padding: 14px;
      }
      body[data-kimi-sidekick-theme="dark"] .composer-card {
        background: #222428;
        border-color: #3a3d42;
      }
      textarea {
        background: transparent;
        border: 0;
        color: inherit;
        font: inherit;
        height: 64px;
        outline: 0;
        resize: none;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <button type="button" aria-label="收起侧边栏">会话目录</button>
        <div class="session-row active">响应式布局计划</div>
        <div class="session-row">桌面端适配审计</div>
        <div class="session-row">主题同步验证</div>
      </aside>
      <section class="con">
        <header class="chat-header">Kimi Code</header>
        <nav class="conversation-toc" aria-label="对话目录">
          <div class="toc-scroll">
            <button type="button" class="toc-row active">
              <span class="toc-bar"></span><span class="toc-label">帮我启动项目</span>
            </button>
            <button type="button" class="toc-row">
              <span class="toc-bar"></span><span class="toc-label">关闭任务 ID</span>
            </button>
          </div>
        </nav>
        <main class="chat-layout">
          <div class="message u-bub turn-anchor" data-turn-id="turn-1">帮我启动项目</div>
          <div class="message a-msg turn-anchor" data-turn-id="assistant-1">项目已启动</div>
          <div class="message u-bub turn-anchor" data-turn-id="turn-2">关闭任务 ID</div>
          <div class="composer">
            <div class="composer-card">
              <textarea role="combobox" placeholder="输入消息…"></textarea>
            </div>
          </div>
        </main>
      </section>
    </div>
    <script>
      const fixtureParameters = new URLSearchParams(window.location.search);
      if (fixtureParameters.get("sidebar") === "off") {
        document.querySelector("aside.side")?.remove();
      }
      if (fixtureParameters.get("mobile") === "true") {
        document.querySelector("nav.conversation-toc")?.remove();
      }
    </script>
    <script src="../../src-tauri/src/frame_workspace_bridge.js"></script>
  </body>
</html>
