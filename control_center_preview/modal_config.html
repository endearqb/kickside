<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>配置中心弹窗</title>
<style>
  :root { --surface-color: #ffffff; --border-color: #e6e8ec; --accent-color: #2563eb; --text-primary: #111827; --text-secondary: #6b7280; --bg-overlay: rgba(0,0,0,0.4); }
  body { font-family: system-ui; margin: 0; background: var(--bg-overlay); display: flex; align-items: center; justify-content: center; height: 100vh; }
  .modal { width: 800px; height: 600px; background: var(--surface-color); border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
  .modal-header { padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: #f9fafb; }
  .modal-header h3 { margin: 0; font-size: 16px; }
  .modal-body { flex: 1; display: flex; }
  .modal-sidebar { width: 180px; border-right: 1px solid var(--border-color); padding: 15px 10px; }
  .tab { padding: 8px 15px; border-radius: 6px; font-size: 13px; color: var(--text-secondary); cursor: pointer; }
  .tab.active { background: #eff6ff; color: var(--accent-color); font-weight: 500; }
  .modal-content { flex: 1; padding: 20px; overflow-y: auto; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 5px; }
  .input { width: 100%; height: 30px; padding: 0 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; box-sizing: border-box; }
  .modal-footer { padding: 15px 20px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 10px; }
  .btn { height: 30px; padding: 0 15px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid transparent; }
  .btn-primary { background: var(--accent-color); color: white; }
  .btn-outline { background: white; border-color: var(--border-color); color: var(--text-primary); }
</style>
</head>
<body>
  <div class="modal">
    <div class="modal-header">
      <h3>API 配置中心</h3>
      <button style="border:none;background:none;cursor:pointer;font-size:16px;">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-sidebar">
        <div class="tab active">Providers</div>
        <div class="tab">Models</div>
        <div class="tab">Services</div>
      </div>
      <div class="modal-content">
        <div style="border: 1px solid var(--border-color); border-radius: 6px; padding: 15px;">
          <h4 style="margin:0 0 15px 0; font-size: 14px;">Kimi API (Default)</h4>
          <div class="form-group">
            <label>API Key</label>
            <input type="password" class="input" value="sk-xxxxxxxxxxxxx">
          </div>
          <div class="form-group">
            <label>Base URL</label>
            <input type="text" class="input" value="https://api.moonshot.cn/v1">
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline">取消</button>
      <button class="btn btn-primary">应用并保存</button>
    </div>
  </div>
</body>
</html>
