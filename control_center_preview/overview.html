<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>概览 - 控制中心</title>
<style>
  :root {
    --bg-color: #f5f6f8;
    --surface-color: #ffffff;
    --border-color: #e6e8ec;
    --accent-color: #2563eb;
    --text-primary: #111827;
    --text-secondary: #6b7280;
  }
  body { font-family: system-ui, sans-serif; margin: 0; background: var(--bg-color); color: var(--text-primary); display: flex; height: 100vh; }
  .sidebar { width: 220px; background: var(--surface-color); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px 10px; }
  .nav-item { display: flex; align-items: center; padding: 10px 15px; border-radius: 6px; cursor: pointer; color: var(--text-secondary); margin-bottom: 5px; font-size: 14px; }
  .nav-item.active { background: #eff6ff; color: var(--accent-color); font-weight: 500; }
  .main { flex: 1; padding: 30px; overflow-y: auto; }
  .header { margin-bottom: 30px; }
  .header h2 { margin: 0 0 5px 0; font-size: 20px; }
  .header p { margin: 0; color: var(--text-secondary); font-size: 14px; }
  .card { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
  .card-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
  .metric { padding: 15px; background: var(--bg-color); border-radius: 6px; border: 1px solid var(--border-color); }
  .metric-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; }
  .metric-value { font-size: 24px; font-weight: 600; color: var(--text-primary); }
  .metric-status { color: #10b981; font-size: 14px; margin-left: 5px; }
  .actions { margin-top: 20px; display: flex; gap: 10px; }
  .btn { height: 30px; padding: 0 15px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; }
  .btn-primary { background: var(--accent-color); color: white; }
  .btn-outline { background: white; border-color: var(--border-color); color: var(--text-primary); }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="nav-item active">概览 Dashboard</div>
    <div class="nav-item">系统设置 Settings</div>
    <div class="nav-item">运行与日志 Runtime</div>
  </aside>
  <main class="main">
    <div class="header">
      <h2>控制中心概览</h2>
      <p>运行统计、健康状态与高频动作入口。</p>
    </div>
    <div class="card">
      <div class="card-title">系统状态</div>
      <div class="grid">
        <div class="metric">
          <div class="metric-label">后端状态</div>
          <div class="metric-value">Running<span class="metric-status">●</span></div>
        </div>
        <div class="metric">
          <div class="metric-label">活动端口 / 工作区</div>
          <div class="metric-value">3456 / 8080</div>
        </div>
        <div class="metric">
          <div class="metric-label">引导完成度</div>
          <div class="metric-value">4/5</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-outline">刷新状态</button>
        <button class="btn btn-outline">重启后端</button>
        <button class="btn btn-outline">打开日志目录</button>
      </div>
    </div>
  </main>
</body>
</html>
